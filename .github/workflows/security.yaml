# Dependency vulnerability scanning. Complements golangci-lint (which only
# runs gosec on first-party code) by checking known CVEs in the dependency
# graph via the Go vulnerability database.
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly disclosed CVEs in pinned deps are surfaced.
    - cron: "0 6 * * 1"
jobs:
  govulncheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
