    commerce.v1.PaymentPolicy:
      type: object
      properties:
        allowInstalments:
          type: boolean
          title: allow_instalments
          description: Buyers may pay in more than one instalment.
        minDepositPercent:
          type: integer
          title: min_deposit_percent
          maximum: 100
          minimum: 0
          format: int32
          description: |-
            The first instalment must be at least this share of the total. Once it
             is paid, stock stays reserved past the payment window. 0 accepts any
             amount.
        minInstalmentPercent:
          type: integer
          title: min_instalment_percent
          maximum: 100
          minimum: 0
          format: int32
          description: Every instalment but the last must be at least this share of the total.
        balanceDueDays:
          type: integer
          title: balance_due_days
          maximum: 3650
          minimum: 0
          format: int32
          description: |-
            Days the buyer has to pay the balance after the first instalment. 0
             means no deadline.
        fulfilAtPercent:
          type: integer
          title: fulfil_at_percent
          maximum: 100
          minimum: 0
          format: int32
          description: |-
            Share that must be paid before the order may be fulfilled. 0 means the
             full amount.
        signalThresholds:
          type: array
          items:
            exclusiveMinimum: 0
            type: integer
            maximum: 100
            format: int32
          title: signal_thresholds
          description: |-
            Paid-share marks that raise an ORDER_EVENT_TYPE_THRESHOLD_CROSSED signal
             when payment crosses them, e.g. [25, 50, 75].
        cancelWhenOverdue:
          type: boolean
          title: cancel_when_overdue
          description: |-
            Cancel the order, release its stock and record a refund of what was paid
             when the balance deadline passes.
      title: PaymentPolicy
      additionalProperties: false
      description: |-
        PaymentPolicy governs paying for an order in instalments and the signals
         raised as payment progresses. Percentages are whole percent of the order
         total.
