      x-required-permissions:
        - cart_manage
  /commerce.v1.CommerceService/CancelOrder:
    post:
      tags:
        - commerce.v1.CommerceService
      summary: CancelOrder
      description: |-
        Cancels an unfulfilled order and returns its stock. Buyers may cancel
         their own unpaid orders; staff may cancel any unfulfilled order.
      operationId: commerce.v1.CommerceService.CancelOrder
      parameters:
        - name: Connect-Protocol-Version
