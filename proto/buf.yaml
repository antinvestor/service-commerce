version: v2
modules:
  - path: commerce
    name: buf.build/antinvestor/commerce
  - path: property
    name: buf.build/antinvestor/property
  - path: procurement
    name: buf.build/antinvestor/procurement
deps:
  - buf.build/antinvestor/common
  - buf.build/bufbuild/protovalidate
  - buf.build/gnostic/gnostic
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_NO_IMPORT_CYCLE
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
    - FILE_NO_DELETE
