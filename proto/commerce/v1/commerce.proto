  CUSTOMER_PRICE_OVERRIDE_STATUS_ACTIVE = 1;
  CUSTOMER_PRICE_OVERRIDE_STATUS_EXPIRED = 2;
}

enum CustomerPriceListAssignmentStatus {
  CUSTOMER_PRICE_LIST_ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  CUSTOMER_PRICE_LIST_ASSIGNMENT_STATUS_ACTIVE = 1;
  CUSTOMER_PRICE_LIST_ASSIGNMENT_STATUS_INACTIVE = 2;
}

// A named collection of prices for product variants, scoped to a shop and currency.
message PriceList {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string shop_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string name = 3;
  string currency = 4;
  int32 priority = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp valid_until = 7;
  PriceListStatus status = 8;
  google.protobuf.Timestamp created_at = 10;
}

// A single price entry within a price list, optionally quantity-tiered.
message PriceListEntry {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string price_list_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string product_variant_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  common.v1.Money unit_price = 4;
  int32 min_quantity = 5;
  int32 max_quantity = 6;
}

// Links a customer to a price list.
message CustomerPriceListAssignment {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string customer_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string price_list_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string assigned_by = 4;
  CustomerPriceListAssignmentStatus status = 5;
  google.protobuf.Timestamp created_at = 10;
}

// A per-customer, per-variant price override that takes precedence over price lists.
message CustomerPriceOverride {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string customer_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string product_variant_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  common.v1.Money unit_price = 4;
  google.protobuf.Timestamp valid_from = 5;
  google.protobuf.Timestamp valid_until = 6;
  string approved_by = 7;
  CustomerPriceOverrideStatus status = 8;
  google.protobuf.Timestamp created_at = 10;
}

// A rule that applies discounts to orders or line items based on conditions.
message DiscountRule {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string shop_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string name = 3;
  DiscountType discount_type = 4;
  double value = 5;
  DiscountAppliesTo applies_to = 6;
  google.protobuf.Struct conditions = 7;
  bool requires_approval = 8;
  double max_discount_percent = 9;
  google.protobuf.Timestamp valid_from = 10;
  google.protobuf.Timestamp valid_until = 11;
  DiscountRuleStatus status = 12;
  google.protobuf.Timestamp created_at = 15;
  // Who approved a rule that requires approval; empty until approved.
  string approved_by = 16;
  google.protobuf.Timestamp approved_at = 17;
}

// The fully resolved price for a variant, showing which source and discounts apply.
message ResolvedPrice {
  string variant_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  common.v1.Money unit_price = 2;
  PriceSource price_source = 3;
  string price_list_id = 4;
  string override_id = 5;
  common.v1.Money discount_amount = 6;
  string discount_rule_id = 7;
  common.v1.Money pre_discount_price = 8;
}

