syntax = "proto3";

package commerce.v1;

// -----------------------------------------------------
// Core notes (normative):
// - Device Service manages device registration, tracking, and key/token management
// - All devices must be registered before use and linked to a profile
// - Supports device logs for session tracking and security auditing
// - KeyObject is used for all key types (FCM tokens, encryption keys, etc.)
// - All timestamps are RFC3339 / google.protobuf.Timestamp
// -----------------------------------------------------

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "common/v1/money.proto";
import "common/v1/permissions.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/antinvestor/apis/go/commerce/v1;commercev1";
option java_multiple_files = true;
option java_package = "commercev1";
option (gnostic.openapi.v3.document) = {
  info: {
    title: "Commerce API"
    version: "v1.0.0"
    description: "The Commerce API provides comprehensive management capabilities to enable trading."
    contact: {
      name: "Ant Investor Ltd"
      url: "https://github.com/antinvestor/service-commerce"
      email: "info@antinvestor.com"
    }
    license: {
      name: "Apache License"
      url: "https://github.com/antinvestor/apis/blob/master/LICENSE"
    }
  }
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
};

/*
   Headless commerce API.

   Scope:
   - shop
   - products + variants
   - orders
   - fulfilment

*/

service CommerceService {
  option (common.v1.service_permissions) = {
    namespace: "service_commerce"
    permissions: [
      "shop_view",
      "shop_create",
      "shop_update",
      "product_view",
      "product_manage",
      "cart_view",
      "cart_manage",
      "order_view",
      "order_manage",
      "fulfilment_view",
      "fulfilment_manage",
      "price_list_view",
      "price_list_manage",
      "customer_price_override",
      "discount_manage",
      "discount_approve",
      "shops_list",
      "ledger_post"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "shop_view",
          "shop_create",
          "shop_update",
          "product_view",
          "product_manage",
          "cart_view",
          "cart_manage",
          "order_view",
          "order_manage",
          "fulfilment_view",
          "fulfilment_manage",
          "price_list_view",
          "price_list_manage",
          "customer_price_override",
          "discount_manage",
          "discount_approve",
          "shops_list",
          "ledger_post"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "shop_view",
          "shop_create",
          "shop_update",
          "product_view",
          "product_manage",
          "cart_view",
          "cart_manage",
          "order_view",
          "order_manage",
          "fulfilment_view",
          "fulfilment_manage",
          "price_list_view",
          "price_list_manage",
          "customer_price_override",
          "discount_manage",
          "discount_approve",
          "shops_list",
          "ledger_post"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "shop_view",
          "product_view",
          "product_manage",
          "cart_view",
          "order_view",
          "order_manage",
          "fulfilment_view",
          "fulfilment_manage",
          "price_list_view",
          "discount_manage",
          "shops_list"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: [
          "shop_view",
          "product_view",
          "cart_view",
          "order_view",
          "fulfilment_view",
          "price_list_view",
          "shops_list"
        ]
      },
      {
        // Members are buyers within the partition: they may browse, build
        // their own cart, and check it out. Handlers bind carts and orders
        // to the caller so this never grants access to other buyers' data.
        role: ROLE_MEMBER
        permissions: [
          "shop_view",
          "product_view",
          "cart_view",
          "cart_manage",
          "order_view",
          "order_manage",
          "price_list_view",
          "shops_list"
        ]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "shop_view",
          "shop_create",
          "shop_update",
          "product_view",
          "product_manage",
          "cart_view",
          "cart_manage",
          "order_view",
          "order_manage",
          "fulfilment_view",
          "fulfilment_manage",
          "price_list_view",
          "price_list_manage",
          "customer_price_override",
          "discount_manage",
          "discount_approve",
          "shops_list",
          "ledger_post"
        ]
      }
    ]
  };

  // ----------------------
  // Shop
  // ----------------------

  // Creates a new shop. The authenticated user becomes the admin.
  rpc CreateShop(CreateShopRequest) returns (CreateShopResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["shop_create"]
    };
  }
  // Retrieves shop details by ID.
  rpc GetShop(GetShopRequest) returns (GetShopResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["shop_view"]
    };
  }
  // Updates shop details.
  rpc UpdateShop(UpdateShopRequest) returns (UpdateShopResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["shop_update"]
    };
  }
  // Lists the shops in the caller's partition.
  rpc ListShops(ListShopsRequest) returns (ListShopsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["shops_list"]
    };
  }
  // Resolves the currency the caller most likely trades in: their currency
  // setting, else the locale of the device they are signed in on, else the
  // country of their first profile address. CreateShop applies the same
  // default when no currency is given.
  rpc ResolveDefaultCurrency(ResolveDefaultCurrencyRequest) returns (ResolveDefaultCurrencyResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["shops_list"]
    };
  }

  // ----------------------
  // Catalog
  // ----------------------

  // Creates a new product in the catalog.
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_manage"]
    };
  }
  // Retrieves a product by its ID.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_view"]
    };
  }
  // Lists products belonging to a shop, with optional search and filtering.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_view"]
    };
  }

  // Creates a new variant for a product.
  rpc CreateProductVariant(CreateProductVariantRequest) returns (CreateProductVariantResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_manage"]
    };
  }
  // Updates an existing product variant.
  rpc UpdateProductVariant(UpdateProductVariantRequest) returns (UpdateProductVariantResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_manage"]
    };
  }
  // Updates a product: details, fulfilment type, status, and its payment
  // policy override.
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_manage"]
    };
  }
  // Lists the variants of a product.
  rpc ListProductVariants(ListProductVariantsRequest) returns (ListProductVariantsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["product_view"]
    };
  }

  // ----------------------
  // Orders
  // ----------------------

  rpc CreateCart(CreateCartRequest) returns (CreateCartResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["cart_manage"]
    };
  }
  rpc GetCart(GetCartRequest) returns (GetCartResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["cart_view"]
    };
  }

  rpc AddCartLine(AddCartLineRequest) returns (AddCartLineResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["cart_manage"]
    };
  }
  rpc RemoveCartLine(RemoveCartLineRequest) returns (RemoveCartLineResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["cart_manage"]
    };
  }

  rpc CreateOrderFromCart(CreateOrderFromCartRequest) returns (CreateOrderFromCartResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }

  // ----------------------
  // Orders
  // ----------------------

  /*
     Creates an order and reserves stock atomically.

     The server MUST:
       - validate all variants belong to the shop
       - validate sufficient stock
       - decrement stock
       - snapshot price and name
       - compute totals

     The order is created in CONFIRMED state
     (since this API does not handle payments).
  */
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }

  // Retrieves an order by ID.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_view"]
    };
  }
  // Lists orders for a shop, with optional search and filtering.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_view"]
    };
  }

  // Starts payment for an order: creates a hosted checkout session and
  // returns the page the buyer should be sent to. Idempotent per order.
  rpc CheckoutOrder(CheckoutOrderRequest) returns (CheckoutOrderResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }
  // Marks an order paid after verifying the checkout session with the
  // payment service. Safe to call repeatedly; used by staff and by the
  // scheduled reconciler.
  rpc ConfirmOrderPayment(ConfirmOrderPaymentRequest) returns (ConfirmOrderPaymentResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }
  // Cancels an unfulfilled order and returns its stock. Buyers may cancel
  // their own unpaid orders; staff may cancel any unfulfilled order.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }
  // Records a payment the shop took itself (cash, bank transfer, a till) as
  // an instalment against the order. Staff only. A reference already
  // recorded on the order is returned as-is, so retries are safe.
  rpc RecordOrderPayment(RecordOrderPaymentRequest) returns (RecordOrderPaymentResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_manage"]
    };
  }
  // Lists payment and lifecycle signals for an order, or for every order in
  // a shop, oldest first. The same events are pushed to the shop's webhook.
  rpc ListOrderEvents(ListOrderEventsRequest) returns (ListOrderEventsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["order_view"]
    };
  }
  // Reconciles orders awaiting payment against the payment service and
  // expires reservations whose payment window has lapsed. Scheduled.
  rpc ReconcilePayments(ReconcilePaymentsRequest) returns (ReconcilePaymentsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["ledger_post"]
    };
  }
  // Posts one balanced ledger transaction per shop for a trading day,
  // merging that day's paid and refunded orders. Scheduled end of day.
  rpc RunEndOfDayLedger(RunEndOfDayLedgerRequest) returns (RunEndOfDayLedgerResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["ledger_post"]
    };
  }

  // ----------------------
  // Fulfilment
  // ----------------------

  /*
     Creates a fulfilment for an order.

     A fulfilment may contain a subset of order lines.
     Quantity per line MUST NOT exceed remaining unfulfilled quantity.
  */
  rpc CreateFulfilment(CreateFulfilmentRequest) returns (CreateFulfilmentResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fulfilment_manage"]
    };
  }

  // Updates a fulfilment (e.g. adding tracking number, marking as shipped).
  rpc UpdateFulfilment(UpdateFulfilmentRequest) returns (UpdateFulfilmentResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fulfilment_manage"]
    };
  }
  // Retrieves a fulfilment by ID.
  rpc GetFulfilment(GetFulfilmentRequest) returns (GetFulfilmentResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fulfilment_view"]
    };
  }
  // Lists an order's fulfilments, oldest first.
  rpc ListFulfilments(ListFulfilmentsRequest) returns (ListFulfilmentsResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fulfilment_view"]
    };
  }

  // ----------------------
  // Pricing
  // ----------------------

  // Creates or updates a price list.
  rpc PriceListSave(PriceListSaveRequest) returns (PriceListSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_manage"]
    };
  }
  // Retrieves a price list by ID.
  rpc PriceListGet(PriceListGetRequest) returns (PriceListGetResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }
  // Searches price lists for a shop.
  rpc PriceListSearch(PriceListSearchRequest) returns (PriceListSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }

  // Replaces all entries for the given variants in a price list.
  rpc PriceListEntryBatchSave(PriceListEntryBatchSaveRequest) returns (PriceListEntryBatchSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_manage"]
    };
  }

  // Creates or updates a customer-to-price-list assignment.
  rpc CustomerPriceListAssignmentSave(CustomerPriceListAssignmentSaveRequest) returns (CustomerPriceListAssignmentSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["customer_price_override"]
    };
  }
  // Searches customer price list assignments.
  rpc CustomerPriceListAssignmentSearch(CustomerPriceListAssignmentSearchRequest) returns (CustomerPriceListAssignmentSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }

  // Creates or updates a customer price override for a specific variant.
  rpc CustomerPriceOverrideSave(CustomerPriceOverrideSaveRequest) returns (CustomerPriceOverrideSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["customer_price_override"]
    };
  }
  // Searches customer price overrides.
  rpc CustomerPriceOverrideSearch(CustomerPriceOverrideSearchRequest) returns (CustomerPriceOverrideSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }

  // Creates or updates a discount rule.
  rpc DiscountRuleSave(DiscountRuleSaveRequest) returns (DiscountRuleSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["discount_manage"]
    };
  }
  // Searches discount rules for a shop.
  rpc DiscountRuleSearch(DiscountRuleSearchRequest) returns (DiscountRuleSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }
  // Approves a discount rule that requires approval, so pricing may apply
  // it automatically.
  rpc DiscountRuleApprove(DiscountRuleApproveRequest) returns (DiscountRuleApproveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["discount_approve"]
    };
  }

  // Resolves the effective price for a variant given customer and quantity context.
  rpc ResolvePrice(ResolvePriceRequest) returns (ResolvePriceResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["price_list_view"]
    };
  }
}

//
// ----------------------
// Shared
// ----------------------

// ----------------------
// Shop
// ----------------------

message Shop {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string name = 2;
  string slug = 3;
  string description = 4;
  ShopStatus status = 5;

  /*
     Media assets associated with the shop (logo, banner, etc.).
     References files in the Files Service.
  */
  repeated string media_ids = 6;
  // ISO 4217 currency every product in the shop is priced in.
  string currency = 7;
  // Contact that receives seller-side notifications (new orders, payments).
  string contact_id = 8;
  // Where the hosted checkout page sends the buyer after paying. Empty uses
  // the service default.
  string checkout_return_url = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Struct extra = 15; // Additional key metadata (algorithm, app_id, etc.)
  // How buyers may pay: in full, or in instalments with thresholds. Products
  // may override it.
  PaymentPolicy payment_policy = 16;
  // HTTPS endpoint order events are POSTed to, signed with the shop's
  // webhook secret.
  string webhook_url = 17;
  // Whether a webhook secret is set. The secret itself is never returned.
  bool webhook_secret_set = 18;
  // Whether anyone may browse the shop and buy from its public page without
  // signing in. Off by default.
  bool public_storefront = 19;
  // The public shop page; empty while public_storefront is off.
  string storefront_url = 20;
}

// PaymentPolicy governs paying for an order in instalments and the signals
// raised as payment progresses. Percentages are whole percent of the order
// total.
message PaymentPolicy {
  // Buyers may pay in more than one instalment.
  bool allow_instalments = 1;
  // The first instalment must be at least this share of the total. Once it
  // is paid, stock stays reserved past the payment window. 0 accepts any
  // amount.
  int32 min_deposit_percent = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Every instalment but the last must be at least this share of the total.
  int32 min_instalment_percent = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Days the buyer has to pay the balance after the first instalment. 0
  // means no deadline.
  int32 balance_due_days = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3650
  }];
  // Share that must be paid before the order may be fulfilled. 0 means the
  // full amount.
  int32 fulfil_at_percent = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Paid-share marks that raise an ORDER_EVENT_TYPE_THRESHOLD_CROSSED signal
  // when payment crosses them, e.g. [25, 50, 75].
  repeated int32 signal_thresholds = 6 [(buf.validate.field).repeated.items.int32 = {
    gt: 0
    lte: 100
  }];
  // Cancel the order, release its stock and record a refund of what was paid
  // when the balance deadline passes.
  bool cancel_when_overdue = 7;
}

enum ShopStatus {
  SHOP_STATUS_UNSPECIFIED = 0;
  SHOP_STATUS_ACTIVE = 1;
  SHOP_STATUS_DISABLED = 2;
}

message CreateShopRequest {
  string name = 1;
  string slug = 2;
  string description = 3;
  // ISO 4217 code. Empty uses the caller's default (see ResolveDefaultCurrency).
  string currency = 4;
  string contact_id = 5;
  repeated string media_ids = 6;
  string checkout_return_url = 7;
  PaymentPolicy payment_policy = 8;
  string webhook_url = 9;
  string webhook_secret = 10;
  bool public_storefront = 11;
}

message CreateShopResponse {
  Shop shop = 1;
}

message UpdateShopRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  google.protobuf.FieldMask update_mask = 2;

  string name = 3;
  string description = 4;
  repeated string media_ids = 5;
  ShopStatus status = 6;
  google.protobuf.Struct extra = 7;
  string currency = 8;
  string contact_id = 9;
  string checkout_return_url = 10;
  PaymentPolicy payment_policy = 11;
  string webhook_url = 12;
  // Write-only. Empty with "webhook_secret" in the mask clears it.
  string webhook_secret = 13;
  bool public_storefront = 14;
}

message UpdateShopResponse {
  Shop shop = 1;
}

message GetShopRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
}

message ListShopsRequest {
  common.v1.SearchRequest search = 1;
}

message ListShopsResponse {
  repeated Shop shops = 1;
  string next_page = 2;
}

message GetShopResponse {
  Shop shop = 1;
}

// Where a resolved default currency came from.
enum CurrencySource {
  CURRENCY_SOURCE_UNSPECIFIED = 0;
  // The caller's "currency" setting in the settings service.
  CURRENCY_SOURCE_PREFERENCE = 1;
  // The locale of the device the caller is signed in on.
  CURRENCY_SOURCE_DEVICE = 2;
  // The country of the caller's first profile address.
  CURRENCY_SOURCE_ADDRESS = 3;
  // Nothing was known about the caller; the platform default applies.
  CURRENCY_SOURCE_PLATFORM_DEFAULT = 4;
}

message ResolveDefaultCurrencyRequest {}

message ResolveDefaultCurrencyResponse {
  // ISO 4217 code.
  string currency = 1;
  CurrencySource source = 2;
}

//
// ----------------------
// Catalog
// ----------------------

message Product {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string shop_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];

  string name = 3;
  string description = 4;
  map<string, string> attributes = 5; // Shared attributes (e.g. "Material": "Cotton")

  FulfilmentType fulfilment_type = 10;

  ProductStatus status = 15;

  /*
     Media assets (images, videos) for the product.
     References files in the Files Service.
  */
  repeated string media_ids = 16;

  google.protobuf.Timestamp created_at = 17;
  // Overrides the shop's payment policy for orders containing this product.
  // Unset uses the shop's.
  PaymentPolicy payment_policy = 18;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ACTIVE = 1;
  PRODUCT_STATUS_INACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

enum FulfilmentType {
  FULFILMENT_TYPE_UNSPECIFIED = 0;

  // Requires shipping / physical handling
  FULFILMENT_TYPE_PHYSICAL = 1;

  // Delivered digitally (license, download, access, etc)
  FULFILMENT_TYPE_DIGITAL = 2;

  // No fulfilment at all (donations, subscriptions started elsewhere, etc)
  FULFILMENT_TYPE_NONE = 3;
}

message ProductVariant {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string product_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];

  string sku = 3;
  string name = 4;

  /*
     Price in minor units (for example cents).
  */
  common.v1.Money price = 5;

  int64 stock_quantity = 7;
  map<string, string> attributes = 6; // Variant-specific attributes (e.g. "Size": "L", "Color": "Blue")
  repeated string media_ids = 10;

  ProductVariantStatus status = 8;

  google.protobuf.Timestamp created_at = 9;
}

enum ProductVariantStatus {
  PRODUCT_VARIANT_STATUS_UNSPECIFIED = 0;
  PRODUCT_VARIANT_STATUS_ACTIVE = 1;
  PRODUCT_VARIANT_STATUS_DISABLED = 2;
}

message CreateProductRequest {
