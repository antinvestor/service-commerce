name: antinvestor_ui_customers
description: >
  Customer management UI library for Antinvestor. Embeddable screens and widgets
  for browsing customers, viewing balances, and receiving payments.
version: 0.1.0
publish_to: none
repository: https://github.com/antinvestor/service-commerce
homepage: https://github.com/antinvestor/service-commerce/tree/main/ui/customers

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core:
    path: ../../../common/ui_core
  antinvestor_ui_profile:
    path: ../../../service-profile/ui/profile
  antinvestor_api_commerce:
    path: ../../sdk/dart/commerce
  antinvestor_api_profile: ^1.52.0
  connectrpc: ^1.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  protobuf: ^4.2.0
  fixnum: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  antinvestor_ui_core:
    path: ../../../common/ui_core

flutter:
  uses-material-design: true
