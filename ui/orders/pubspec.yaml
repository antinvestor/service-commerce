name: antinvestor_ui_orders
description: >
  Order management UI library for Antinvestor. Embeddable screens and widgets
  for cart, checkout, orders, and fulfilment workflows.
version: 0.2.0
publish_to: none
repository: https://github.com/antinvestor/service-commerce
homepage: https://github.com/antinvestor/service-commerce/tree/main/ui/orders

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core: ^0.6.0
  antinvestor_ui_catalog:
    path: ../catalog
  antinvestor_ui_customers:
    path: ../customers
  antinvestor_ui_profile: ^0.3.0
  url_launcher: ^6.3.0
  antinvestor_api_commerce:
    path: ../../sdk/dart/commerce
  antinvestor_api_profile: ^2.0.0
  connectrpc: ^2.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
