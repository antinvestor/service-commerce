name: antinvestor_ui_procurement
description: >
  Procurement UI library for Antinvestor. Embeddable screens and widgets
  for suppliers, purchase orders, and goods receipts.
version: 0.2.0
publish_to: none
repository: https://github.com/antinvestor/service-commerce
homepage: https://github.com/antinvestor/service-commerce/tree/main/ui/procurement

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core: ^0.6.0
  antinvestor_ui_profile: ^0.3.0
  antinvestor_api_procurement:
    path: ../../sdk/dart/procurement
  antinvestor_api_profile: ^2.0.0
  connectrpc: ^2.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
